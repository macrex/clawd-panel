[platformio]
default_envs = board

[env]
lib_deps =
    bblanchon/ArduinoJson@^7.2.0

[env:native]
; Testes que rodam no PC, sem placa. Aqui mora a aritmetica pura: o parse do
; /status e a regra de nivel do Clawd.
;
; O compilador vem de `toolchain/`, um w64devkit portatil, e nao do PATH: esta
; maquina nao tem gcc instalado — so os cross-toolchains do xtensa, que geram
; binario que o PC nao executa. Sem apontar daqui, `pio test -e native` falha com
; "'gcc' nao e reconhecido" e os testes ficam escritos mas nunca executados, que
; foi o estado deste projeto por varias entregas.
;
; A pasta esta no .gitignore: e ferramenta de maquina, nao codigo do projeto.
platform = native
test_framework = unity
build_flags = -std=gnu++17
extra_scripts = pre:tools/native_toolchain.py

[env:board]
; Arduino core 3.x via pioarduino. O platform oficial da Espressif parou no
; core 2.0.17, que nao tem esp32-hal-periman.h e por isso nao compila o
; Arduino_GFX atual. Core 3.x tambem e o que o firmware de fabrica usava.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; upload_port/monitor_port fixos (COM4) apodreciam: a porta re-enumera a cada
; reset e muda de maquina para maquina. Deixe o PlatformIO autodetectar
; (funciona quando so ha uma placa 303A/1001 conectada), ou passe na hora:
;   pio run -t upload --upload-port COM4
;   pio device monitor --port COM4
; A skill esp32-flash (D:\workspace\skills\esp32\esp32-flash) resolve a porta
; sozinha pelo VID/PID e usa --upload-port; nao depende destas duas linhas.
; O padrao do PlatformIO e `--before default-reset --after hard-reset`, e nesta
; placa o hard-reset reinicia DE VOLTA no bootloader: o flag de download fica
; latchado no USB-Serial/JTAG nativo. A gravacao "da certo" — hashes conferem,
; log diz sucesso — e a placa fica com a tela preta e a serial muda, o que faz
; o suspeito virar o firmware recem-compilado em vez da forma de gravar.
; `watchdog-reset` e a unica saida do modo download; `usb-reset` e a entrada
; (sem ele, o esptool tenta reset por RTS e diz `No serial data received`).
board_upload.before_reset = usb-reset
board_upload.after_reset = watchdog-reset
board_build.arduino.memory_type = dio_opi
board_build.flash_mode = dio
; Tabela propria: o `app1` do default virou a particao `assets`, onde moram os
; sprites. Ver partitions_clawd.csv e a spec no vault.
board_build.partitions = partitions_clawd.csv
board_upload.flash_size = 16MB
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    ${env.lib_deps}
    moononournation/GFX Library for Arduino@^1.5.0
